# Publica la app como web app en GitHub Pages: https://andriuu20.github.io/App-f-tbolestadisticas/
# Se ejecuta sola cada vez que cambia la rama main (y se puede lanzar a mano desde la pestaña Actions).
name: Publicar web app

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/publicar-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo export --platform web --output-dir dist
      # GitHub Pages devuelve 404.html en las direcciones que no existen (p. ej. /partido/123):
      # así esas direcciones también abren la app.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
