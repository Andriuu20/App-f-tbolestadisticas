<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: ocupa toda la pantalla del iPhone (las zonas seguras las respeta la app) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Fútbol Stats</title>
    <meta name="theme-color" content="#0D1117" />
    <!-- Al añadirla a la pantalla de inicio del iPhone, se abre a pantalla completa como una app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fútbol Stats" />
    <link rel="apple-touch-icon" href="/App-f-tbolestadisticas/apple-touch-icon.png" />
    <link rel="manifest" href="/App-f-tbolestadisticas/manifest.json" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #0D1117;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <noscript> Hace falta activar JavaScript para usar esta app. </noscript>
    <div id="root"></div>
  </body>
</html>
