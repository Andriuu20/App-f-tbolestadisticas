<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Apuestas recomendadas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0D1117; color: #E6EDF3; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 52px 16px 8px; display: flex; align-items: center; gap: 8px">
    <a href="Partido.dc.html" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; background: #161B22; border: 1px solid #262D36">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column">
      <span style="font-size: 18px; font-weight: 700">Apuestas recomendadas</span>
      <span style="font-size: 13px; color: #9AA4AF">Real Madrid – Sevilla · 18:30</span>
    </div>
  </div>
  <div style="padding: 8px 16px 4px">
    <div style="display: flex; align-items: center; gap: 10px; background: #161B22; border: 1px solid #262D36; border-radius: 12px; padding: 10px 12px">
      <label for="stake" style="font-size: 13px; color: #9AA4AF; flex: 1">Si apuestas</label>
      <input id="stake" type="text" value="10 €" style="width: 72px; height: 36px; border-radius: 8px; border: 1px solid #262D36; background: #0D1117; color: #E6EDF3; font-family: 'JetBrains Mono', monospace; font-size: 15px; text-align: center">
    </div>
  </div>
  <div style="flex: 1; overflow-y: auto; padding: 10px 16px 16px; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{picks}}" as="p" hint-placeholder-count="3">
      <div style="background: #161B22; border: 1px solid #262D36; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; justify-content: space-between; align-items: center">
          <span style="{{p.badge}}">{{p.level}}</span>
          <span style="font-size: 12px; color: #9AA4AF">{{p.fails}}</span>
        </div>
        <span style="font-size: 16px; font-weight: 600; line-height: 1.35">{{p.bet}}</span>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
          <div style="background: #0D1117; border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #9AA4AF">Probabilidad</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 600; color: {{p.color}}">{{p.prob}}</span></div>
          <div style="background: #0D1117; border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #9AA4AF">Cuota</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 600">{{p.odds}}</span></div>
          <div style="background: #0D1117; border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #9AA4AF">Recibes</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 600">{{p.ret}}</span></div>
        </div>
        <span style="font-size: 13px; color: #9AA4AF; line-height: 1.45">{{p.why}}</span>
      </div>
    </sc-for>
    <p style="margin: 4px 4px 0; font-size: 12px; color: #9AA4AF; line-height: 1.5">Estimaciones estadísticas, no garantías. Ninguna apuesta es segura al 100 %.</p>
  </div>
  <nav style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #262D36; background: #0D1117; padding: 8px 8px 28px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; color: #9AA4AF; font-size: 11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7l4 3-1.5 5h-5L8 10z"></path></svg>
      Partidos
    </a>
    <a href="Rankings.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; color: #9AA4AF; font-size: 11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"></path></svg>
      Rankings
    </a>
    <a href="Recomendaciones.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; color: #A3E635; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z"></path></svg>
      Para ti
    </a>
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; color: #9AA4AF; font-size: 11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>
      Historial
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    function badge(bg) {
      return 'height: 26px; padding: 0 10px; border-radius: 13px; display: inline-flex; align-items: center; font-size: 12px; font-weight: 700; letter-spacing: 0.5px; color: #0D1117; background: ' + bg + ';';
    }
    var picks = [
      { level: 'SEGURA', badge: badge('#A3E635'), color: '#A3E635', fails: 'Fallas ~3 de cada 10',
        bet: 'Real Madrid no pierde + más de 1,5 goles', prob: '72%', odds: '1,45', ret: '14,50 €',
        why: 'La cuota implica un 69 % y el modelo estima un 72 %: tiene valor. El Madrid no ha perdido en casa en sus últimos 8 partidos.' },
      { level: 'MEDIA', badge: badge('#58A6FF'), color: '#58A6FF', fails: 'Fallas ~5 de cada 10',
        bet: 'Real Madrid gana + más de 8,5 córners', prob: '47%', odds: '2,10', ret: '21,00 €',
        why: 'Cuando el Madrid gana en casa suele dominar y forzar córners: media de 10,2 entre los dos equipos.' },
      { level: 'ARRIESGADA', badge: badge('#F0883E'), color: '#F0883E', fails: 'Fallas ~8 de cada 10',
        bet: 'Real Madrid gana, ambos marcan y más de 3,5 tarjetas', prob: '18%', odds: '6,50', ret: '65,00 €',
        why: 'El árbitro saca 5,1 tarjetas de media y el Sevilla marca en el 60 % de sus partidos fuera.' }
    ];
    return { picks: picks };
  }
}
</script>
</body>
</html>
