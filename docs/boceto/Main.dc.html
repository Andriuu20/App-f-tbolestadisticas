<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Partidos de hoy</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0D1117; color: #E6EDF3; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 56px 20px 12px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; color: #9AA4AF">Jueves, 5 de noviembre</span>
        <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.5px">Partidos de hoy</h1>
      </div>
      <button aria-label="Buscar" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #262D36; background: #161B22; color: #E6EDF3; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      </button>
    </div>
    <div style="display: flex; gap: 8px">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="5">
        <button style="{{d.style}}">{{d.label}}</button>
      </sc-for>
    </div>
    <div style="display: flex; gap: 8px; overflow-x: auto">
      <sc-for list="{{leagues}}" as="l" hint-placeholder-count="4">
        <button style="{{l.style}}" onClick="{{l.pick}}">{{l.name}}</button>
      </sc-for>
    </div>
  </div>
  <div style="flex: 1; overflow-y: auto; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 6px 4px 0">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 1px; color: #9AA4AF">LALIGA · JORNADA 12</span>
      <span style="font-size: 12px; color: #9AA4AF">O2.5 · BTTS · Córners</span>
    </div>
    <sc-for list="{{matches}}" as="m" hint-placeholder-count="5">
      <a href="Partido.dc.html" style="background: #161B22; border: 1px solid #262D36; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #9AA4AF; width: 44px">{{m.time}}</span>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 15px; font-weight: 600">{{m.home}}</span>
            <span style="font-size: 15px; font-weight: 600">{{m.away}}</span>
          </div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA4AF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
          <div style="background: #0D1117; border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 11px; color: #9AA4AF">Más de 2,5</span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 600; color: {{m.overColor}}">{{m.over}}</span>
          </div>
          <div style="background: #0D1117; border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 11px; color: #9AA4AF">Ambos marcan</span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 600">{{m.btts}}</span>
          </div>
          <div style="background: #0D1117; border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 11px; color: #9AA4AF">Córners media</span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 600">{{m.corners}}</span>
          </div>
        </div>
      </a>
    </sc-for>
  </div>
  <nav style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #262D36; background: #0D1117; padding: 8px 8px 28px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; color: #A3E635; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7l4 3-1.5 5h-5L8 10z"></path></svg>
      Partidos
    </a>
    <a href="Rankings.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; color: #9AA4AF; font-size: 11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"></path></svg>
      Rankings
    </a>
    <a href="Recomendaciones.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; color: #9AA4AF; font-size: 11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z"></path></svg>
      Para ti
    </a>
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; color: #9AA4AF; font-size: 11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>
      Historial
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { league: 'LaLiga' }; }
  renderVals() {
    var chip = 'height: 36px; padding: 0 14px; border-radius: 18px; font-family: Inter, sans-serif; font-size: 13px; font-weight: 600; white-space: nowrap; ';
    var on = chip + 'background: #A3E635; color: #0D1117; border: 1px solid #A3E635;';
    var off = chip + 'background: #161B22; color: #E6EDF3; border: 1px solid #262D36;';
    var self = this;
    var leagues = ['LaLiga', 'Premier', 'Serie A', 'Bundesliga', 'Champions'].map(function (n) {
      return { name: n, style: self.state.league === n ? on : off, pick: function () { self.setState({ league: n }); } };
    });
    var days = ['Ayer', 'Hoy', 'Vie', 'Sáb', 'Dom'].map(function (d) {
      return { label: d, style: (d === 'Hoy' ? on : off) + ' flex: 1; padding: 0;' };
    });
    var hi = '#A3E635', mid = '#E6EDF3';
    var matches = [
      { time: '18:30', home: 'Real Madrid', away: 'Sevilla', over: '64%', overColor: hi, btts: '52%', corners: '10,2' },
      { time: '18:30', home: 'Girona', away: 'Betis', over: '58%', overColor: hi, btts: '61%', corners: '9,4' },
      { time: '21:00', home: 'Atlético', away: 'Valencia', over: '41%', overColor: mid, btts: '44%', corners: '8,8' },
      { time: '21:00', home: 'Athletic', away: 'Villarreal', over: '55%', overColor: mid, btts: '57%', corners: '10,7' }
    ];
    return { leagues: leagues, days: days, matches: matches };
  }
}
</script>
</body>
</html>
